# Flatpak construit à partir de l'exécutable Linux compilé par la release
# (déposé à côté de ce manifeste par le workflow).
app-id: io.github.orthagh.Matterfew
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: matterfew
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Trousseau (jeton de connexion) et notifications.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  # Téléchargement des pièces jointes.
  - --filesystem=xdg-download
modules:
  - name: matterfew
    buildsystem: simple
    build-commands:
      - install -Dm755 matterfew /app/bin/matterfew
      - install -Dm644 io.github.orthagh.Matterfew.desktop /app/share/applications/io.github.orthagh.Matterfew.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.orthagh.Matterfew.png
      - install -Dm644 io.github.orthagh.Matterfew.metainfo.xml /app/share/metainfo/io.github.orthagh.Matterfew.metainfo.xml
    sources:
      - type: file
        path: matterfew
      - type: file
        path: icon.png
      - type: file
        path: io.github.orthagh.Matterfew.desktop
      - type: file
        path: io.github.orthagh.Matterfew.metainfo.xml
