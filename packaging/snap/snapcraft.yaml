# Snap built from the Linux executable compiled by the release workflow
# (dropped into payload/ by that workflow). The version is replaced by the tag's.
name: matterfew
title: Matterfew
version: '0.0.0'
summary: Native Mattermost desktop client, in Rust with GPUI
description: |
  Desktop client for Mattermost: fast and lightweight, with search,
  threads, notifications, a Markdown editor and your server's theme.
license: MIT
website: https://github.com/orthagh/matterfew
base: core24
grade: stable
confinement: strict

apps:
  matterfew:
    command: bin/matterfew
    desktop: share/applications/matterfew.desktop
    extensions: [gnome]
    plugs:
      - network
      - home
      - desktop
      - wayland
      - x11
      - opengl
      - password-manager-service
      - removable-media

# No stage-packages on purpose: GTK, WebKitGTK and libxkbcommon-x11 come from
# the gnome-46-2404 platform, and the whole graphics stack (Vulkan loader and
# drivers, libdrm) from mesa-2404 through the extension's gpu-2404 plug. Staging
# a copy of any of them shadows the platform's and breaks on newer GPUs.
parts:
  matterfew:
    plugin: dump
    source: payload
  desktop:
    plugin: dump
    source: gui
    organize:
      matterfew.desktop: share/applications/matterfew.desktop
