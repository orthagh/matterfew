[package]
name = "mm-gpui"
version = "0.1.0"
edition = "2024"
description = "Client de bureau expérimental pour Mattermost, en Rust avec GPUI"
license = "MIT OR Apache-2.0"

[dependencies]
# GPUI Kit : GPUI (version épinglée) + composants stylés (saisie, listes, Markdown…)
gpui-kit = "0.10"

# Réseau
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures = "0.3"
async-channel = "2"

# Données
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"

# Contenu des messages
pulldown-cmark = { version = "0.13", default-features = false }
emojis = "0.7"

# Notifications de bureau
notify-rust = "4"

# Mémorisation de la connexion (jeton dans le coffre du système)
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
dirs = "6"
wry = "0.57"
tao = "0.37"

# Développement (`cargo run`) : notre code peu optimisé pour recompiler
# vite, les bibliothèques (GPUI…) optimisées pour que l'interface reste fluide.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `cargo run --release` : optimisé mais recompilation incrémentale rapide.
[profile.release]
incremental = true
codegen-units = 16

# Binaire à distribuer : `cargo build --profile dist` (plus long à compiler,
# un peu plus petit et plus rapide).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
incremental = false
strip = true
