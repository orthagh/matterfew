[package]
name = "matterfew"
version = "0.5.0"
edition = "2024"
description = "Client de bureau Mattermost natif, en Rust avec GPUI"
license = "MIT"
authors = ["Alexandre Delaunay"]
repository = "https://github.com/orthagh/matterfew"
readme = "README.md"

[dependencies]
# GPUI Kit : GPUI (version épinglée) + composants stylés (saisie, listes, Markdown…)
gpui-kit = { version = "0.10", features = ["syntect"] }

# Réseau
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "blocking"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures = "0.3"
# Mise à jour : téléchargement signé (minisign), installation, relance
cargo-packager-updater = "0.2.3"
semver = "1"
async-channel = "2"

# Données
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"

# Contenu des messages
pulldown-cmark = { version = "0.13", default-features = false }
emojis = "0.7"


# Mémorisation de la connexion (jeton dans le coffre du système)
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
dirs = "6"
wry = "0.57"
tao = "0.37"

# Icône de l'application (générée au démarrage)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
raw-window-handle = "0.6"
chrono-tz = "0.10"
twemoji-assets = "1.5"
regex = "1"
rust-i18n = "4"
sys-locale = "0.3"
rmcp = { version = "3.11", features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tokio-util = "0.7"
schemars = "1"
uuid = { version = "1", features = ["v4"] }
spellbook = "0.4"
flate2 = "1"

# Intégration Windows : notifications avec identité et clic, pastille de la
# barre des tâches, icône de la zone de notification.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Threading",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Data_Pdf",
    "Storage_Streams",
    "Foundation",
] }

# Développement (`cargo run`) : notre code peu optimisé pour recompiler
# vite, les bibliothèques (GPUI…) optimisées pour que l'interface reste fluide.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `cargo run --release` : optimisé mais recompilation incrémentale rapide.
[profile.release]
incremental = true
codegen-units = 16

# Binaire à distribuer : `cargo build --profile dist` (plus long à compiler,
# un peu plus petit et plus rapide).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
incremental = false
strip = true

[build-dependencies]
winresource = "0.1"

# Notifications de bureau hors Windows (Windows : voir desktop.rs).
[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"

# Linux (GNOME, KDE) : icône StatusNotifierItem, pastille du lanceur (D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Wayland: a notification click brings the window forward with the activation
# token the desktop hands out, which GPUI has no way to take.
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# macOS : pastille et rebond de l'icône du Dock, icône de la barre des menus.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }

# Tests de bout en bout : fenêtres GPUI sans écran (TestApp).
[dev-dependencies]
gpui-pre = { version = "=0.3.12", features = ["test-support"] }

# Installateurs (cargo-packager, utilisé par .github/workflows/release.yml) :
# NSIS sous Windows, .dmg sous macOS, .deb et AppImage sous Linux.
[package.metadata.packager]
product-name = "Matterfew"
identifier = "io.github.orthagh.Matterfew"
publisher = "Alexandre Delaunay"
category = "SocialNetworking"
copyright = "Copyright (c) 2026 Alexandre Delaunay"
out-dir = "target/packages"
binaries-dir = "target/dist"
binaries = [{ path = "matterfew", main = true }]
icons = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/256x256.png",
  "assets/icons/512x512.png",
]

[package.metadata.packager.deb]
depends = ["libgtk-3-0", "libwebkit2gtk-4.1-0", "libxkbcommon-x11-0", "libvulkan1"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
