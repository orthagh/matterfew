    pr_comment: "[glpi-project/glpi] New comment by [lea-bernard](https://github.com/lea-bernard) on [#18350 Fix the export of merged tickets](https://github.com/glpi-project/glpi/pull/18350):\n> Add a test for empty columns, otherwise perfect."
