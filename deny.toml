# cargo-deny : failles connues, licences, provenance des dépendances.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
# Failles (RustSec) : bloquantes. Crates abandonnées : signalées seulement
# pour nos dépendances directes.
unmaintained = "workspace"
yanked = "warn"
ignore = [
  # chrono : utilisée par GPUI lui-même (impossible à retirer de notre côté),
  # « non maintenue » sans faille connue. Remplacement par jiff à envisager
  # quand GPUI aura migré.
  { id = "RUSTSEC-2026-0543", reason = "transitive via GPUI, no known vulnerability" },
  { id = "RUSTSEC-2026-0555", reason = "depends on chrono; time zones of the profile card" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "NCSA",
  "Ubuntu-font-1.0",
]

[bans]
# GPUI et ses dépendances tirent plusieurs versions de certaines crates.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
