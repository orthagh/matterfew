# Installateurs, sur un tag de version (v1.2.3) :
#   Windows  : installateur NSIS (.exe)
#   macOS    : image disque (.dmg), Apple Silicon et Intel
#   Linux    : snap, flatpak (+ .deb et AppImage, et l'exécutable seul)
# La release GitHub reprend la section du CHANGELOG de cette version.
#
# Mise à jour automatique : avec la clé des secrets
# CARGO_PACKAGER_SIGN_PRIVATE_KEY(_PASSWORD), les paquets sont signés
# (minisign, fichiers .sig) et latest.json les décrit pour l'application.
# Le dépôt flatpak (GitHub Pages) est signé avec FLATPAK_GPG_PRIVATE_KEY
# et FLATPAK_GPG_PASSPHRASE.
#
# « Run workflow » (workflow_dispatch) construit tout sans rien publier :
# les installateurs restent dans les artefacts de l'exécution. L'option
# « flatpak_repo » republie toutefois le dépôt flatpak (GitHub Pages) à
# partir de la branche choisie, sans release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flatpak_repo:
        description: Republier le dépôt flatpak (GitHub Pages)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Version et notes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Version du tag = version de Cargo.toml
        shell: bash
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$crate" ]]; then
              echo "::error::Le tag v$tag ne correspond pas à la version de Cargo.toml ($crate)"
              exit 1
            fi
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
      - name: Notes de version (CHANGELOG)
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { keep = 1; next }
            index($0, "## [") == 1 { keep = 0 }
            keep { print }
          ' CHANGELOG.md > notes.md
          if [[ "$GITHUB_REF" == refs/tags/v* && ! -s notes.md ]]; then
            echo "::error::Pas de section « ## [$v] » dans CHANGELOG.md"
            exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    name: Paquets ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            formats: nsis
          - name: macos-arm64
            os: macos-15
            formats: dmg,app
            arch: aarch64
          - name: macos-x64
            os: macos-15-intel
            formats: dmg,app
            arch: x64
          - name: linux-x64
            os: ubuntu-22.04
            formats: deb,appimage
    steps:
      - uses: actions/checkout@v5
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: sh packaging/linux-deps.sh
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: release-${{ matrix.name }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Compilation optimisée
        run: cargo build --profile dist --locked
      - name: Installateurs (signés si la clé est fournie)
        shell: bash
        env:
          SIGN_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          SIGN_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGN_KEY" ]; then
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$SIGN_KEY"
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="$SIGN_PASSWORD"
          else
            echo "::warning::Pas de clé de signature : paquets non signés, pas de mise à jour automatique."
          fi
          cargo packager --profile dist --formats ${{ matrix.formats }} --verbose
      - name: "Application macOS pour la mise à jour (nom par architecture)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd target/packages
          name="Matterfew_${{ needs.version.outputs.version }}_${{ matrix.arch }}.app.tar.gz"
          if [ -f Matterfew.app.tar.gz ]; then
            mv Matterfew.app.tar.gz "$name"
            [ -f Matterfew.app.tar.gz.sig ] && mv Matterfew.app.tar.gz.sig "$name.sig"
          else
            tar -czf "$name" Matterfew.app
          fi
      - name: "Exécutable seul (Linux, pour snap et flatpak)"
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/packages
          tar -czf target/packages/matterfew-linux-x64.tar.gz -C target/dist matterfew
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: |
            target/packages/*.exe
            target/packages/*.dmg
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.tar.gz
            target/packages/*.sig
          if-no-files-found: error

  updater-manifest:
    name: Manifeste de mise à jour
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{packages-*,notes}"
      - name: latest.json
        run: |
          python3 packaging/updater-manifest.py artifacts "${{ needs.version.outputs.version }}" \
            artifacts/notes/notes.md "${{ github.repository }}" updater/latest.json
          ls -l updater || true
      - uses: actions/upload-artifact@v4
        with:
          name: packages-updater
          path: updater/latest.json
          if-no-files-found: warn

  snap:
    name: Paquet snap
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-x64
          path: linux
      - name: Contenu du snap
        run: |
          mkdir -p packaging/snap/payload/bin packaging/snap/payload/share/icons/hicolor/512x512/apps packaging/snap/payload/share/applications
          tar -xzf linux/matterfew-linux-x64.tar.gz -C packaging/snap/payload/bin
          cp assets/icons/512x512.png packaging/snap/payload/share/icons/hicolor/512x512/apps/matterfew.png
          sed -i "s/^version: .*/version: '${{ needs.version.outputs.version }}'/" packaging/snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: snap
        with:
          path: packaging/snap
      - uses: actions/upload-artifact@v4
        with:
          name: packages-snap
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

  flatpak:
    name: Paquet flatpak
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # /var/lib/flatpak sur un volume (Docker y recopie le contenu de
      # l'image) : sur overlayfs, la mise à jour du SDK préinstallé échoue
      # (« Invalid cross-device link ») et flatpak-builder plante.
      options: --privileged --volume /var/lib/flatpak
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux-x64
          path: linux
      - name: Exécutable et icône à côté du manifeste
        run: |
          tar -xzf linux/matterfew-linux-x64.tar.gz -C packaging/flatpak
          cp assets/icons/512x512.png packaging/flatpak/icon.png
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: matterfew-${{ needs.version.outputs.version }}.flatpak
          manifest-path: packaging/flatpak/io.github.orthagh.Matterfew.yml
          cache-key: flatpak-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak
          path: matterfew-*.flatpak
          if-no-files-found: error

  flatpak-repo:
    name: Dépôt flatpak (GitHub Pages)
    if: startsWith(github.ref, 'refs/tags/v') || inputs.flatpak_repo
    needs: [version, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: packages-flatpak
          path: bundle
      - name: Dépôt signé
        id: repo
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "::warning::Pas de FLATPAK_GPG_PRIVATE_KEY : dépôt flatpak non publié."
            exit 0
          fi
          # Clé, phrase secrète et signature dans la même étape : l'agent GPG
          # (qui garde la phrase secrète) ne survit pas d'une étape à l'autre.
          export GNUPGHOME=/tmp/gnupg
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "allow-preset-passphrase" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          if [ -n "$GPG_PASSPHRASE" ]; then
            preset=$(command -v gpg-preset-passphrase || ls /usr/libexec/gpg-preset-passphrase /usr/lib/gnupg/gpg-preset-passphrase /usr/lib/gnupg2/gpg-preset-passphrase 2>/dev/null | head -1)
            if [ -z "$preset" ]; then
              echo "::error::gpg-preset-passphrase introuvable dans l'image."
              exit 1
            fi
            gpg-connect-agent /bye
            for grip in $(gpg --list-secret-keys --with-keygrip --with-colons | awk -F: '/^grp/ {print $10}'); do
              "$preset" --preset --passphrase "$GPG_PASSPHRASE" "$grip"
            done
          fi
          # Contrôle : la clé signe sans rien demander.
          if ! echo test | gpg --batch --pinentry-mode error --local-user "$key" --sign > /dev/null; then
            echo "::error::La clé GPG demande une phrase secrète : secret FLATPAK_GPG_PASSPHRASE absent ou faux."
            exit 1
          fi
          sh packaging/flatpak/repo.sh bundle/*.flatpak "$key" \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" site
          echo "done=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.repo.outputs.done == 'true'
        with:
          path: site

  pages:
    name: Publication GitHub Pages
    needs: flatpak-repo
    if: needs.flatpak-repo.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

  publish:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build, snap, flatpak, updater-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.version.outputs.version }}
          body_path: artifacts/notes/notes.md
          files: |
            artifacts/packages-*/*
