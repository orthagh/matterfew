# Intégration continue : chaque commit poussé et chaque pull request.
# Format, Clippy strict et tests (dont les tests de bout en bout sans écran)
# sur Windows, Linux et macOS, puis audit des dépendances (failles, licences).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  check:
    name: Clippy et tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: sh packaging/linux-deps.sh
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          # Cache des dépendances (Swatinem/rust-cache), par système.
          cache-key: ${{ matrix.os }}
      - name: Clippy (avertissements = erreurs)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (unitaires et de bout en bout)
        run: cargo test --locked

  audit:
    name: Dépendances (failles, licences, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans
