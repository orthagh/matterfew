# Mises à jour proposées une fois par mois, regroupées en une seule pull
# request par écosystème. Les versions majeures (qui demandent d'adapter le
# code) ne sont pas proposées automatiquement : à faire volontairement.
# Les failles connues restent signalées par cargo-deny à chaque commit.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      dependances:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
